# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: ie-bank-frontend

# ---------- TRIGGERS ----------
on:
  # 1️⃣  Every push → Dev build (including pushes to main)
  push:
    branches:
      - '**'          # all branches

  # 2️⃣  Pull-requests that target main → UAT build
  pull_request:
    branches:
      - main

  # 3️⃣  Manual “Run workflow” button
  workflow_dispatch:
# --------------------------------

env:
  FRONTEND_WEBAPP_DEV: jseijas-fe-dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: npm install, build
        run: |
          npm install
          npm run build -- --mode development --dest dist-dev   # builds into dist-dev/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app-dev
          path: dist-dev/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'     # ✅ valid — ignore VS Code warning
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app-dev

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.FRONTEND_WEBAPP_DEV }}
          package: .
